name: reactions
on:
  schedule:
    - cron: "0 */2 * * *"  # каждые два часа
  workflow_dispatch:
jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python react_posts.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ vars.CHANNEL || '@gladkie_linii_msk' }}
          REACT_CHANNELS: ${{ vars.REACT_CHANNELS || '@gladkie_linii_msk,@thaiworldspa,@crownthaispakozhuhovo' }}
          REACTIONS: ${{ vars.REACTIONS || '🔥,❤,👍' }}
